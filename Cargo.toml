[package]
name = "teamfs"
version = "0.8.0"
edition = "2021"
description = "Rust + fuse-rs 科研实验文件输入追溯与可恢复文件系统"
license = "MIT"

[dependencies]
fuse = "=0.3.1"
libc = "0.2"
time = "=0.1.45"
rusqlite = { version = "=0.31.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
sha2 = "=0.10.8"

[profile.release]
overflow-checks = true
